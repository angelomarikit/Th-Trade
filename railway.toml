# Force Dockerfile build so Railpack does not mis-detect this npm workspace as Nx/Next.
# Dashboard Variables still required (do not commit .env).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run start:api"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
